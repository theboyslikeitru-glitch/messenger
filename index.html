<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0e1621;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: #17212b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            padding: 12px 16px;
            background: #17212b;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #242f3d;
        }
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5288c1, #2b5278);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 18px;
        }
        .header-info h4 { font-size: 15px; font-weight: 600; }
        .header-info p { font-size: 12px; color: #7f91a4; }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0e1621;
            background-image: radial-gradient(#1c2733 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #2b5278; border-radius: 3px; }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .my-message {
            background: #2b5278;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .friend-message {
            background: #182533;
            color: #e1e9f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            color: #7f91a4;
            margin-top: 4px;
            text-align: right;
            display: block;
        }
        .my-message .time { color: #a4c2e0; }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #17212b;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #242f3d;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            background: #242f3d;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        #messageInput::placeholder { color: #7f91a4; }
        
        #fileInput { display: none; }
        .file-label {
            cursor: pointer;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: #242f3d;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .file-label:hover { background: #2b5278; }
        
        #sendButton {
            width: 42px; height: 42px;
            background: #5288c1;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        #sendButton:hover { background: #6ba3e0; }
        #sendButton:disabled { background: #2b5278; cursor: not-allowed; }

        .upload-status {
            font-size: 12px;
            color: #7f91a4;
            padding: 4px 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">Ч</div>
            <div class="header-info">
                <h4>Чат с другом</h4>
                <p>онлайн</p>
            </div>
        </div>
        <div id="messages"></div>
        <div id="uploadStatus" class="upload-status" style="display:none;">Загрузка файла...</div>
        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,video/*">
            <label for="fileInput" class="file-label">📎</label>
            <input type="text" id="messageInput" placeholder="Написать сообщение...">
            <button id="sendButton">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // 🔥 ВАШ FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBlAYzUmOkC_MH76DUL9bD6UmJBpE3Z9Lc",
            authDomain: "chatter-e7982.firebaseapp.com",
            projectId: "chatter-e7982",
            storageBucket: "chatter-e7982.firebasestorage.app",
            messagingSenderId: "927337991779",
            appId: "1:927337991779:web:ace042c78413965cf1b256"
        };

        // 🔑 ВАШИ ДАННЫЕ SUPABASE
        const SUPABASE_URL = "https://gbbkbxqckwnyxtzuoqtu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_fncdxOmBregEK53R0YgoQg_K7X0lr09";

        // Инициализация Firebase (для текста)
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Инициализация Supabase (для файлов)
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const BUCKET_NAME = 'chat-files';

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        let userId = localStorage.getItem('messenger_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('messenger_user_id', userId);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Слушаем сообщения в реальном времени
        const q = query(collection(db, "messages"), orderBy("timestamp"));
        onSnapshot(q, (snapshot) => {
            messagesDiv.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const msgDiv = document.createElement('div');
                const isMine = data.userId === userId;
                msgDiv.classList.add('message', isMine ? 'my-message' : 'friend-message');
                
                let content = '';
                if (data.type === 'file') {
                    if (data.fileType.startsWith('image/')) {
                        content = `<img src="${data.url}" alt="фото" loading="lazy">`;
                    } else if (data.fileType.startsWith('video/')) {
                        content = `<video src="${data.url}" controls preload="metadata"></video>`;
                    }
                } else {
                    content = data.text;
                }
                msgDiv.innerHTML = content + `<span class="time">${formatTime(data.timestamp)}</span>`;
                messagesDiv.appendChild(msgDiv);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Отправка текста
        sendButton.addEventListener('click', sendTextMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        async function sendTextMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            messageInput.value = '';
            sendButton.disabled = true;
            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    timestamp: serverTimestamp(),
                    type: 'text',
                    userId: userId
                });
            } catch (e) {
                console.error("Ошибка отправки: ", e);
                alert("Не удалось отправить сообщение: " + e.message);
            } finally {
                sendButton.disabled = false;
            }
        }

        // Отправка файла через Supabase Storage
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 50 * 1024 * 1024) {
                alert("Файл слишком большой. Максимум 50 МБ.");
                fileInput.value = '';
                return;
            }

            uploadStatus.style.display = 'block';
            uploadStatus.textContent = `Загрузка файла: ${file.name}...`;

            const fileName = `${Date.now()}_${file.name}`;

            try {
                // Загружаем файл в Supabase Storage
                const { data, error } = await supabase.storage
                    .from(BUCKET_NAME)
                    .upload(fileName, file);

                if (error) throw error;

                // Получаем публичную ссылку
                const { data: urlData } = supabase.storage
                    .from(BUCKET_NAME)
                    .getPublicUrl(fileName);

                const downloadURL = urlData.publicUrl;

                // Сохраняем сообщение в Firestore
                await addDoc(collection(db, "messages"), {
                    url: downloadURL,
                    fileType: file.type,
                    timestamp: serverTimestamp(),
                    type: 'file',
                    userId: userId,
                    fileName: file.name
                });

            } catch (error) {
                console.error("Ошибка загрузки файла: ", error);
                alert("Не удалось загрузить файл: " + error.message);
            } finally {
                fileInput.value = '';
                uploadStatus.style.display = 'none';
            }
        });
    </script>
</body>
</html>
